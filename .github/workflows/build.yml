name: Build Playden PS5 debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Check out Playden with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply the China/Alibaba TLS patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/steam/backend/http_client.cpp")
          text = path.read_text()
          anchor = '    PLAYDEN_SETOPT(CURLOPT_SSLVERSION, CURL_SSLVERSION_TLSv1_2);\n'
          addition = (
              '    // Steam Cloud in China is served from Alibaba OSS; its TLS 1.2\n'
              '    // ServerKeyExchange uses RSA-PSS, which the PS5 Mbed TLS rejects.\n'
              '    // Static-RSA AES-CBC avoids ServerKeyExchange entirely.\n'
              '    if (request.url.find("aliyuncs.com") != std::string::npos) {\n'
              '      PLAYDEN_SETOPT(CURLOPT_SSL_CIPHER_LIST, "AES128-SHA:AES256-SHA");\n'
              '    }\n'
          )
          if anchor not in text:
              raise SystemExit("http_client.cpp: TLS anchor not found")
          path.write_text(text.replace(anchor, anchor + addition, 1))
          print("Patched", path)
          PY

      - name: Write the China CDN cell patch source
        run: |
          cat > /tmp/cdn_servers.cpp <<'CPP'
          CdnError CdnClient::Servers(std::uint32_t cell_id, const std::atomic<bool>& cancel,
                                      std::vector<ContentServer>* out) {
            // Steam answers cell 0 with the cell it guesses from the request address, and for this console
            // that is Los Angeles. The nearby cells are asked as well: 45 and 34 are served from Hong Kong
            // and Singapore, 47 is Alibaba's mainland China CDN. The caller's own cell is kept too, so the
            // "Fastest" race can always fall back to the servers Steam itself picked.
            std::vector<std::uint32_t> cells;
            for (const std::uint32_t nearby : {45u, 34u, 47u, cell_id})
              if (std::find(cells.begin(), cells.end(), nearby) == cells.end()) cells.push_back(nearby);

            std::vector<ContentServer> usable, plain;
            std::vector<std::string> seen;
            std::size_t listed = 0;
            const auto by_load = [](const ContentServer& left, const ContentServer& right) {
              return left.load < right.load;
            };
            for (std::size_t index = 0; index < cells.size() && !cancel; ++index) {
              std::vector<std::uint8_t> body;
              const auto error = Get(
                  "https://api.steampowered.com/IContentServerDirectoryService/GetServersForSteamPipe/v1/?cell_id=" +
                      std::to_string(cells[index]) + "&format=json",
                  kMaxServerListDownloadBytes, 15'000, cancel, &body);
              if (error == CdnError::kCanceled) return error;
              if (error != CdnError::kNone) continue;
              const std::string_view text(body.empty() ? "" : reinterpret_cast<const char*>(body.data()), body.size());
              const auto root = json::Parse(text, json::Limits{512 * 1024, 8, 8192, 4096});
              const auto* response = root ? root->Find("response") : nullptr;
              const auto* servers = response ? response->Find("servers") : nullptr;
              if (!servers || !servers->is_array()) continue;
              std::vector<ContentServer> cell_usable, cell_plain;
              for (const auto& server : servers->array()) {
                ++listed;
                const auto* type = server.Find("type");
                const auto* host = server.Find("host");
                const auto* vhost = server.Find("vhost");
                const auto* https = server.Find("https_support");
                const auto* load = server.Find("load");
                const auto* priority = server.Find("priority_class");
                if (!type || !type->is_string() || (type->text() != "SteamCache" && type->text() != "CDN")) continue;
                if (!host || !host->is_string() || !ValidCdnHost(host->text())) continue;
                if (std::find(seen.begin(), seen.end(), host->text()) != seen.end()) continue;
                seen.push_back(host->text());
                ContentServer entry;
                entry.host = host->text();
                entry.vhost = vhost && vhost->is_string() && ValidCdnHost(vhost->text()) ? vhost->text() : entry.host;
                entry.https = !(https && https->is_string() && https->text() == "unavailable");
                if (load) {
                  if (const auto value = load->AsUint64(); value && *value < 100000) entry.load = static_cast<int>(*value);
                }
                if (priority) {
                  if (const auto value = priority->AsUint64())
                    entry.priority = static_cast<int>(std::min<std::uint64_t>(*value, 9));
                }
                (entry.https ? cell_usable : cell_plain).push_back(std::move(entry));
              }
              // Keep the cells in the order asked, so the nearest servers stay at the front of the list.
              std::stable_sort(cell_usable.begin(), cell_usable.end(), by_load);
              std::stable_sort(cell_plain.begin(), cell_plain.end(), by_load);
              for (auto& server : cell_usable) usable.push_back(std::move(server));
              for (auto& server : cell_plain) plain.push_back(std::move(server));
            }
            // Alibaba's mainland CDN is plain HTTP, so it is listed after every HTTPS server: "Test servers"
            // and the "Fastest" race can still pick it, while an automatic choice prefers HTTPS.
            for (auto& server : plain) usable.push_back(std::move(server));
            if (usable.empty()) {
              last_failure_ = "servers=" + std::to_string(listed) + " usable=0";
              return CdnError::kProtocol;
            }
            *out = std::move(usable);
            return CdnError::kNone;
          }
          CPP

      - name: Apply the China CDN cell patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/steam/backend/cdn_client.cpp")
          text = path.read_text()
          replacement = Path("/tmp/cdn_servers.cpp").read_text().rstrip("\n") + "\n"
          start = text.index("CdnError CdnClient::Servers(")
          end_marker = "  *out = std::move(usable);\n  return CdnError::kNone;\n}\n"
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + replacement + text[end:])
          print("Patched", path)
          PY

      - name: Raise the download slot count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          patch = Path("src/steam/backend/depot_installer.cpp")
          text = patch.read_text()
          old = "tuning.slots = std::clamp(value, 1, 8);"
          if old not in text:
              raise SystemExit("depot_installer.cpp: slot clamp not found")
          patch.write_text(text.replace(old, "tuning.slots = std::clamp(value, 1, 32);", 1))
          for name in ("src/homebrew/ps5.cpp", "src/homebrew/host.cpp"):
              path = Path(name)
              text = path.read_text()
              old = "tuning.slots = 8;"
              if old not in text:
                  raise SystemExit(name + ": slot assignment not found")
              path.write_text(text.replace(old, "tuning.slots = 16;", 1))
          print("Patched download slots")
          PY

      - name: Localize the interface to Chinese
        run: python3 scripts/localize-zh.py

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install cmake ninja pkgconf llvm@18
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned PS5 SDK and toolchain
        run: scripts/fetch-deps.sh

      - name: Build the Lapy root helper
        run: scripts/build-lapy-helper.sh

      - name: Build the Playden PS5 app package
        run: |
          set -o pipefail
          scripts/build-homebrew-ps5.sh 2>&1 | tee /tmp/playden-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "error:|fatal error:|undefined reference|ninja: build stopped" /tmp/playden-build.log | head -8 | sed 's/^/::error::/' || true
          fi
          exit $status

      - name: Package the debug build
        run: |
          cd build/homebrew-ps5/dist
          ditto -c -k --sequesterRsrc --keepParent FAKE77031 FAKE77031-debug.zip

      - name: Publish the debug build as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "debug-${{ github.run_number }}-${{ github.run_attempt }}" \
            "build/homebrew-ps5/dist/FAKE77031-debug.zip" \
            --title "Playden debug build ${{ github.run_number }}" \
            --notes "Playden debug build: Alibaba/Steam Cloud TLS static-RSA patch, plus Hong Kong and Alibaba download cells." \
            --repo "${{ github.repository }}"

      - name: Upload the FAKE77031 package
        uses: actions/upload-artifact@v4
        with:
          name: FAKE77031-debug
          path: build/homebrew-ps5/dist/FAKE77031
          if-no-files-found: error
